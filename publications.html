<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Publications — Cédric Buche</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="topbar">
  <span class="nav-name">Cédric Buche</span>
  <button class="nav-toggle" aria-expanded="false">Menu ☰</button>
</div>
<div class="shell">
  
<nav id="sidebar"></nav>

  <main>
</div>
<script src="assets/publications-data.js"></script>
<script>
(function(){
  var CATS = [
    {key:'journals', label:'International journals'},
    {key:'conferences', label:'International conferences'},
    {key:'preprints', label:'Preprints'},
    {key:'national', label:'Articles in national journals'}
  ];

  function esc(s){
    return String(s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; });
  }

  function renderPub(p){
    var badges = (p.b||[]).map(function(b){ return '<span class="badge">'+esc(b)+'</span>'; }).join('');
    var link = p.l ? '<div class="lnk"><a href="'+esc(p.l)+'">source / DOI ↗</a></div>' : '';
    return '' +
      '<div class="pub">' +
        '<div class="yr">'+p.y+'</div>' +
        '<div>' +
          '<div class="ti">'+esc(p.t)+'</div>' +
          '<div class="au">'+esc(p.a)+'</div>' +
          '<div class="ve">'+esc(p.v)+'</div>' +
          (badges ? '<div class="badges">'+badges+'</div>' : '') +
          link +
        '</div>' +
      '</div>';
  }

  function render(){
    var root = document.getElementById('pub-root');
    var html = '';
    CATS.forEach(function(c){
      var items = PUBLICATIONS.filter(function(p){ return p.cat === c.key; })
                               .sort(function(a,b){ return b.y - a.y; });
      if(!items.length) return;
      html += '<section class="pub-section" data-cat="'+c.key+'">';
      html += '<div class="pub-section-title">'+c.label+' <span style="color:var(--ink-soft); font-weight:400;">('+items.length+')</span></div>';
      items.forEach(function(p){ html += renderPub(p); });
      html += '</section>';
    });
    root.innerHTML = html;
  }

  render();
})();
</script>
<script src="assets/main.js"></script>
</body>
</html>
