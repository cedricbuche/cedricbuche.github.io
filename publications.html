<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Publications — Cédric Buche</title>
<link rel="stylesheet" href="assets/style.css">
</head>

<body>

<div class="topbar">
  <span class="nav-name">Cédric Buche</span>
  <button class="nav-toggle" aria-expanded="false">
    Menu ☰
  </button>
</div>


<div class="shell">

  <nav id="sidebar"></nav>


  <main>
    <div class="wrap">

      <p class="eyebrow">Publications</p>
      <h1>Bibliography</h1>

      <p>
        Links:
        <a href="http://hal.archives-ouvertes.fr/Public/afficheRequetePubli.php">
          HAL
        </a>
        ·
        <a href="http://scholar.google.com/citations?hl=en&user=yNTv2kwAAAAJ&view_op=list_works&sortby=pubdate">
          Google Scholar
        </a>

        <br><br>

        Journal/conference ranks from 
        <a href="http://portal.core.edu.au/jnl-ranks/">CORE journals</a> /
        <a href="http://portal.core.edu.au/conf-ranks/">CORE conferences</a>,
        quartiles from <a href="https://www.scimagojr.com/">SJR</a>

        <br><br>
      </p>


      <div class="pub-filters">
        <button class="active" data-cat="all">All</button>
        <button data-cat="year">By year</button>
        <button data-cat="journals">International journals</button>
        <button data-cat="conferences">International conferences</button>
        <button data-cat="preprints">Preprints</button>
        <button data-cat="national">National journals</button>
      </div>


      <div id="pub-root">Loading…</div>


    </div>
  </main>


</div>



<script src="assets/publications-data.js"></script>

<script>

(function(){


var CATS = [
  {key:'journals', label:'International journals'},
  {key:'conferences', label:'International conferences'},
  {key:'preprints', label:'Preprints'},
  {key:'national', label:'Articles in national journals'}
];



function esc(s){

  return String(s).replace(/[&<>]/g, function(c){

    return {
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;'
    }[c];

  });

}




function renderPub(p){

  var badges = (p.b || [])
    .map(function(b){
      return '<span class="badge">'+esc(b)+'</span>';
    })
    .join('');


  var link = p.l ?
    '<div class="lnk"><a href="'+esc(p.l)+'">source / DOI ↗</a></div>'
    :
    '';



  return ''

    + '<div class="pub">'

      + '<div class="yr">'+p.y+'</div>'

      + '<div>'

        + '<div class="ti">'+esc(p.t)+'</div>'

        + '<div class="au">'+esc(p.a)+'</div>'

        + '<div class="ve">'+esc(p.v)+'</div>'

        + (badges ? '<div class="badges">'+badges+'</div>' : '')

        + link

      + '</div>'

    + '</div>';

}





function render(mode){


  var root = document.getElementById('pub-root');

  var html = '';



  /*
    Global chronological view
    All publication types mixed
  */

  if(mode === 'year'){



    var items = [];



    CATS.forEach(function(c){


      PUBLICATIONS

        .filter(function(p){

          return p.cat === c.key;

        })

        .forEach(function(p){

          items.push(p);

        });


    });



    items.sort(function(a,b){

      return Number(b.y) - Number(a.y);

    });



    var currentYear = null;



    items.forEach(function(p){



      var year = String(p.y);



      if(year !== currentYear){



        if(currentYear !== null){

          html += '</section>';

        }



        currentYear = year;



        html += '<section class="pub-section">';

        html += '<div class="pub-section-title">'
             + year
             + '</div>';

      }



      html += renderPub(p);



    });



    if(currentYear !== null){

      html += '</section>';

    }



    if(html === ''){

      html = '<p>No publications found.</p>';

    }



  }





  /*
    Category view
  */

  else {



    CATS.forEach(function(c){



      if(mode !== 'all' && mode !== c.key){

        return;

      }



      var items = PUBLICATIONS

        .filter(function(p){

          return p.cat === c.key;

        })

        .sort(function(a,b){

          return Number(b.y)-Number(a.y);

        });





      if(!items.length){

        return;

      }





      html += '<section class="pub-section" data-cat="'+c.key+'">';



      html += '<div class="pub-section-title">'
           + c.label
           + ' <span style="color:var(--ink-soft); font-weight:400;">('
           + items.length
           + ')</span></div>';





      items.forEach(function(p){

        html += renderPub(p);

      });




      html += '</section>';



    });


  }



  root.innerHTML = html;



}





/*
  Buttons
*/


document.querySelectorAll('.pub-filters button')

.forEach(function(btn){



  btn.addEventListener('click', function(){



    document.querySelectorAll('.pub-filters button')

      .forEach(function(b){

        b.classList.remove('active');

      });



    btn.classList.add('active');



    render(btn.dataset.cat);



  });



});





render('all');



})();

</script>


<script src="assets/main.js"></script>

</body>
</html>
