<script src="assets/publications-data.js"></script>

<script>

(function(){


var CATS = [
  {key:'journals', label:'International journals'},
  {key:'conferences', label:'International conferences'},
  {key:'preprints', label:'Preprints'},
  {key:'national', label:'Articles in national journals'}
];



function esc(s){

  return String(s).replace(/[&<>]/g, function(c){

    return {
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;'
    }[c];

  });

}




function renderPub(p){

  var badges = (p.b || [])
    .map(function(b){
      return '<span class="badge">'+esc(b)+'</span>';
    })
    .join('');


  var link = p.l ?
    '<div class="lnk"><a href="'+esc(p.l)+'">source / DOI ↗</a></div>'
    :
    '';



  return ''
    + '<div class="pub">'

      + '<div class="yr">'+p.y+'</div>'

      + '<div>'

        + '<div class="ti">'+esc(p.t)+'</div>'

        + '<div class="au">'+esc(p.a)+'</div>'

        + '<div class="ve">'+esc(p.v)+'</div>'

        + (badges ? '<div class="badges">'+badges+'</div>' : '')

        + link

      + '</div>'

    + '</div>';

}





function render(mode){

  var root = document.getElementById('pub-root');

  var html = '';



  /*
    All publications sorted by year
  */

  if(mode === 'year'){


    var items = PUBLICATIONS
      .slice()
      .sort(function(a,b){

        return Number(b.y)-Number(a.y);

      });



    var currentYear = null;



    items.forEach(function(p){


      var year = String(p.y);



      if(year !== currentYear){



        if(currentYear !== null){

          html += '</section>';

        }



        currentYear = year;



        html += '<section class="pub-section">';

        html += '<div class="pub-section-title">'
             + year
             + '</div>';

      }



      html += renderPub(p);



    });



    if(currentYear !== null){

      html += '</section>';

    }



  }





  /*
    Category display
  */

  else {



    CATS.forEach(function(c){



      if(mode !== 'all' && mode !== c.key){

        return;

      }



      var items = PUBLICATIONS

        .filter(function(p){

          return p.cat === c.key;

        })

        .sort(function(a,b){

          return Number(b.y)-Number(a.y);

        });





      if(!items.length){

        return;

      }





      html += '<section class="pub-section" data-cat="'+c.key+'">';



      html += '<div class="pub-section-title">'
           + c.label
           + ' <span style="color:var(--ink-soft); font-weight:400;">('
           + items.length
           + ')</span></div>';





      items.forEach(function(p){

        html += renderPub(p);

      });




      html += '</section>';



    });


  }



  root.innerHTML = html;



}





/*
  Buttons
*/


document.querySelectorAll('.pub-filters button')

.forEach(function(btn){



  btn.addEventListener('click', function(){



    document.querySelectorAll('.pub-filters button')

      .forEach(function(b){

        b.classList.remove('active');

      });



    btn.classList.add('active');



    render(btn.dataset.cat);



  });



});





render('all');



})();

</script>
